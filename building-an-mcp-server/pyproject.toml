[project]
name = "building-an-mcp-server-course"
version = "2026.10.19"
description = "Course: Building an MCP server (state of the art as of 2026-10-19, spec 2026-07-28)"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]==2.3.0",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = ["pytest>=9", "anyio>=4.9", "hypothesis>=6.120"]  # hypothesis: module 06, exercise 4

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
# solutions/ hold the learner-facing solved copies (checked via `make solve`), workspace/ is the learner's.
norecursedirs = [".*", "*.egg-info", "build", "dist", "node_modules", "venv", "solutions", "workspace"]
pythonpath = ["."]  # course_kit is importable from exercise tests
testpaths = ["modules", "appendix-typescript"]
filterwarnings = ["ignore::mcp.shared.exceptions.MCPDeprecationWarning"]
