[project]
name = "depintel-mcp"
version = "0.8.0"
description = "MCP server: PyPI package metadata and OSV vulnerability lookups"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",      # SDK v2 = spec 2026-07-28 (serves legacy clients too)
    "httpx>=0.28",
]

[project.scripts]
depintel-mcp = "depintel_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depintel_mcp"]
