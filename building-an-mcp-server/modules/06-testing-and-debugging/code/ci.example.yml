# Example GitHub Actions workflow (copy to .github/workflows/ci.yml once the repo has a remote).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: uv sync
      - run: uv run pytest
      - run: uv run python modules/06-testing-and-debugging/code/catalog_lock.py   # fails on tool-catalog drift
      - run: PY=.venv/bin/python modules/06-testing-and-debugging/code/inspector_smoke.sh
